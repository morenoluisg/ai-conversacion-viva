[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minambiente-conversacion-viva"
version = "0.1.0"
description = "Captura de audio, transcripción y visualización de conversaciones ambientales"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Luis Gabriel Moreno Sandoval" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=14,<18",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
local = ["faster-whisper>=1.1,<2"]
dev = ["build>=1,<2"]

[project.scripts]
conversacion-viva = "minambiente_live.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minambiente_live = ["static/*.html", "static/*.js"]
